name: CodeQL Advanced

on:
  push:
    branches: ["main", "remediation/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 17 * * 2"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions,javascript-typescript
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:actions-and-javascript-typescript"
          upload: never
      - name: Stage CodeQL SARIF
        if: always()
        shell: bash
        run: |
          mkdir -p results
          if compgen -G "../results/*.sarif" > /dev/null; then
            cp ../results/*.sarif results/
          else
            echo "::warning::No CodeQL SARIF files were generated."
          fi
      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: results/*.sarif
          if-no-files-found: warn
          retention-days: 14
